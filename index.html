<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBOG受付 カメラテスト</title>
　<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin: 16px 0;
    }

    #result {
      white-space: pre-wrap;
    }

    video {
      width: 100%;
      margin-top: 16px;
      background: #000;
    }
  </style>
</head>

<body>

  <h1>OBOG受付 カメラテスト</h1>

  <p>
    GitHub Pages上でgetUserMedia()をテストします。
  </p>

  <button type="button" onclick="startCamera()">
    📷 カメラを起動
  </button>
  
  <button type="button" onclick="startQrScanner()">
    🔍 QRコードを読み取る
  </button>
  
  <p id="result">待機中</p>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="qr-reader"></div>

  <p id="qr-result">QR読み取り待機中</p>
  
  <script>
    async function startCamera() {
      const result = document.getElementById('result');
      const video = document.getElementById('camera');

      result.textContent = 'カメラ起動中...';

      try {
        if (!navigator.mediaDevices) {
          throw new Error('navigator.mediaDevices が利用できません');
        }

        if (!navigator.mediaDevices.getUserMedia) {
          throw new Error('getUserMedia が利用できません');
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment'
            },
            audio: false
          });

        video.srcObject = stream;

        result.textContent =
          '成功：カメラを取得できました！';

      } catch (error) {
        result.textContent =
          '失敗\n' +
          'name: ' + (error.name || '不明') + '\n' +
          'message: ' + (error.message || String(error));

        console.error(error);
      }
    }
    async function startQrScanner() {
  const qrResult = document.getElementById('qr-result');

  qrResult.textContent = 'QRリーダー起動中...';

  const scanner = new Html5Qrcode('qr-reader');

  try {
    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
   function(decodedText) {
  try {
    const url = new URL(decodedText);
    const receptionId = url.searchParams.get('id');

    if (!receptionId) {
      throw new Error('受付IDがURLに含まれていません');
    }

    qrResult.textContent =
      'QR読み取り成功！\n' +
      '受付ID：' + receptionId;

  } catch (error) {
    qrResult.textContent =
      'QRコードの解析に失敗しました。\n' +
      '読み取り内容：' + decodedText;
  }
},
      function() {
        // QRをまだ認識していない間は何もしない
      }
    );
  } catch (error) {
    qrResult.textContent =
      'QRリーダー起動失敗\n' +
      'name: ' + (error.name || '不明') + '\n' +
      'message: ' + (error.message || String(error));

    console.error(error);
  }
}
  </script>

</body>
</html>
