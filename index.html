<html lang="ja">
<head>

　<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin: 16px 0;
    }

    .back-button {
        width: auto;
        padding: 8px 12px;
        font-size: 14px;
        margin: 8px 0 16px;
    }

    .qr-scanner-wrapper {
        position: relative;
        width: 100%;
        margin: 18px auto 0;
    }
    
    #qr-reader {
        width: 100%;
        margin: 0;
        border: none !important;
        border-radius: 18px;
        overflow: hidden;
        background: #111111;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    
    #qr-reader video {
        display: block;
        width: 100% !important;
        border-radius: 18px;
    }
    
    .qr-scan-frame {
    --qr-frame-color: #ffffff;

    position: absolute;
    top: 50%;
    left: 50%;
    width: 250px;
    height: 250px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.15s ease;

    background:
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left top / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left top / 6px 46px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right top / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right top / 6px 46px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left bottom / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left bottom / 6px 46px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right bottom / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right bottom / 6px 46px no-repeat;
}
    
    .qr-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 0;
        font-size: 14px;
        font-weight: 500;
        color: #666666;
    }
    
    .qr-status::before {
        content: "";
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #9ca3af;
    }

    .qr-status.is-success {
        align-items: flex-start;
        padding: 14px 16px;
        border: 1px solid #bbf7d0;
        border-radius: 12px;
        background: #f0fdf4;
        color: #166534;
        font-weight: 600;
        line-height: 1.6;
        white-space: pre-line;
    }
    
    .qr-status.is-success::before {
        content: "✓";
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin-top: 1px;
        border-radius: 50%;
        background: #16a34a;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        animation: qr-success-pop 0.16s ease-out;
    }

    @keyframes qr-success-pop {
        0% {
            transform: scale(0.7);
            opacity: 0;
        }
    
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    #qr-shaded-region > div {
        display: none !important;
    }

    .qr-scan-frame.is-visible {
        opacity: 1;
    }

    .qr-scan-frame.is-success {
        --qr-frame-color: #16a34a;
    }

    #qr-reader__scan_region {
        border-radius: 18px;
        overflow: hidden;
    }
    
    #qr-reader__scan_region > div {
        border-color: #16a34a !important;
    }

    .brand-header {
        margin-bottom: 28px;
        color: #27317A;
    }
    
    .brand-choir {

    .brand-header h1 {

    .brand-system {

    }

    .home-section-title {
        margin: 28px 0 16px;

        font-weight: 700;
        color: #222222;
    }

    .home-menu-button {
        width: 100%;
        padding: 18px 20px;
        margin: 8px 0;
        font-size: 18px;
        font-weight: 600;
        text-align: left;
        border-radius: 12px;

        background: #ffffff;

  .reception-status {

  .reception-sort-controls {

  .reception-sort-controls p {

  .reception-sort-controls button {

</style>
</head>

  <script>

    function showScreen(screenId) {
        const screenIds = [
            'homeScreen',
            'qrScreen',
            'searchScreen',
            'listScreen',
            'detailScreen'
        ];
    
        screenIds.forEach(function(id) {
            const screen = document.getElementById(id);
    
            if (id === screenId) {
                screen.style.display = 'block';
            } else {
                screen.style.display = 'none';
            }
        });
    }

    function showListScreen() {
        showScreen('listScreen');
    }

    function showQrScreen() {
        showScreen('qrScreen');
        startQrScanner();
    }

    function showSearchScreen() {
        showScreen('searchScreen');
    }

    function showHomeScreen() {
        showScreen('homeScreen');
    }
    
    function renderReceptionAction(
    participant,
    targetArea = document.getElementById('qr-result'),
    method = 'QR'
    ) {
        const qrResult = targetArea;
    
      if (participant.receptionStatus !== '受付済') {
        const checkInButton = document.createElement('button');
        checkInButton.textContent = '受付する';
        
        checkInButton.onclick = function() {
          executeCheckIn(participant, method, targetArea, checkInButton);
        };
        
        qrResult.appendChild(document.createElement('br'));
        qrResult.appendChild(document.createElement('br'));
        qrResult.appendChild(checkInButton);
      } else {
          const cancelButton = document.createElement('button');
          cancelButton.textContent = '受付取消';
          
          cancelButton.onclick = function() {
              executeCancel(participant, method, targetArea, cancelButton);
          };
          
          qrResult.appendChild(document.createElement('br'));
          qrResult.appendChild(document.createElement('br'));
          qrResult.appendChild(cancelButton);
      }
    }

    function executeCheckIn(participant, method = 'QR', targetArea = document.getElementById('qr-result'), checkInButton) {
    const qrResult = targetArea;
    
      checkInButton.disabled = true;
      checkInButton.textContent = '受付処理中...';

      const callbackName = 'checkInCallback_' + Date.now();

      window[callbackName] = function(result) {
        if (result.success) {
          participant.receptionStatus = '受付済';
      
          qrResult.innerHTML =
            '✓ 受付完了！<br><br>' +
            '氏名：' + result.name + '<br>' +
            '受付時刻：' + result.time;
      
          alert(
            result.name + ' 様の受付が完了しました。\n' +
            '受付時刻：' + result.time
          );

          renderReceptionAction(participant, targetArea, method);
          loadReceptionList();
        } else {
          checkInButton.disabled = false;
          checkInButton.textContent = '受付する';
          alert(result.message);
        }
      };

      const script = document.createElement('script');
      
      script.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=checkin' +
        '&id=' + encodeURIComponent(participant.receptionId) +
        '&method=' + encodeURIComponent(method) +
        '&callback=' + encodeURIComponent(callbackName);
      
      document.body.appendChild(script);
      
    }

    function executeCancel(participant, method = 'QR', targetArea = document.getElementById('qr-result'), cancelButton) {
    const confirmed = confirm(participant.name + ' 様の受付を取り消してよろしいですか？');

    if (!confirmed) {
        return;
    }

    const qrResult = targetArea;    
        cancelButton.disabled = true;
        cancelButton.textContent = '取消処理中...';


        const callbackName = 'cancelCallback_' + Date.now();
        
        window[callbackName] = function(result) {
            if (result.success) {
                participant.receptionStatus = '未受付';
        
                qrResult.innerHTML =
                    '✓ 受付取消完了<br><br>' +
                    '氏名：' + result.name;
        
                renderReceptionAction(participant, targetArea, method);   
                loadReceptionList();
            } else {
                cancelButton.disabled = false;
                cancelButton.textContent = '受付取消';
                alert(result.message);
            }
            delete window[callbackName];
            script.remove();
          
        };

        const script = document.createElement('script');
        
        script.src =
            'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
            '?api=cancel' +
            '&id=' + encodeURIComponent(participant.receptionId) +
            '&method=' + encodeURIComponent(method) +
            '&callback=' + encodeURIComponent(callbackName);
        
        document.body.appendChild(script);
      
    }
    
    async function startQrScanner() {
        const qrResult = document.getElementById('qr-result');
        const qrReader = document.getElementById('qr-reader');
        const qrScanFrame = document.querySelector('.qr-scan-frame');
        
        qrScanFrame.classList.remove('is-visible');
        qrScanFrame.classList.remove('is-success');
        
        qrReader.replaceChildren();
        qrReader.style.display = 'block';
        
        qrResult.textContent = 'QRリーダー起動中...';
      
        qrReader.style.display = 'block';
        qrResult.textContent = 'QRリーダー起動中...';
      
      
        const scanner = new Html5Qrcode('qr-reader');
        let qrDetected = false;
      
        try {
            await scanner.start(
              { facingMode: 'environment' },
              {
                fps: 10,
                qrbox: {
                  width: 250,
                  height: 250
                }
              },
           async function(decodedText) {
            if (qrDetected) {
                return;
            }
        
            qrDetected = true;
            
            qrScanFrame.classList.add('is-visible');
            qrScanFrame.classList.add('is-success');
            qrResult.textContent = 'QRコードを認識しました';
            
            if ('vibrate' in navigator) {
                navigator.vibrate(60);
            }
        
            await new Promise(function(resolve) {
                setTimeout(resolve, 450);
            });
            
            qrScanFrame.classList.remove('is-visible');
            
            await new Promise(function(resolve) {
                setTimeout(resolve, 180);
            });
            
            await scanner.stop().catch(function(error) {
                console.error(error);
            });
            
            scanner.clear();
            
            qrScanFrame.classList.remove('is-success');
            qrReader.replaceChildren();
            qrReader.style.display = 'none';
        
             
             try {
                 const url = new URL(decodedText);
                 const receptionId = url.searchParams.get('id');
              
                if (!receptionId) {
                    throw new Error('受付IDがURLに含まれていません');
                }
                     
          qrResult.classList.add('is-success');
          qrResult.textContent =
              'QRコードを認識しました\n' +
              '参加者情報を確認しています...';
    
        const callbackName = 'participantCallback_' + Date.now();
    
       window[callbackName] = function(participant) {
        if (participant.success) {
            showParticipant(participant, 'QR');
        } else {
          
        qrResult.textContent =
            '参加者を確認できませんでした。\n' +
            participant.message;
    }

    delete window[callbackName];
    script.remove();
};

    const script = document.createElement('script');
    
    script.src =
      'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
      '?api=participant' +
      '&id=' + encodeURIComponent(receptionId) +
      '&callback=' + encodeURIComponent(callbackName);
    
    script.onerror = function() {
        qrResult.innerHTML +=
            '<br>参加者情報の取得に失敗しました。';
    
        delete window[callbackName];
        script.remove();
    };

    document.body.appendChild(script);

} catch (error) {
qrResult.textContent =
    'QRコードの解析に失敗しました。\n' +
    '読み取り内容：' + decodedText;
}
},
      function() {
        // QRをまだ認識していない間は何もしない
      }
    );

  if (!qrDetected) {
      qrScanFrame.classList.add('is-visible');
      qrResult.textContent = '読み取り待機中';
  }
          
  } catch (error) {
    qrReader.style.display = 'none';
          
    qrResult.textContent =
      'QRリーダー起動失敗\n' +
      'name: ' + (error.name || '不明') + '\n' +
      'message: ' + (error.message || String(error));

    console.error(error);
  }
}

function searchParticipantsByName() {
    const keyword = document.getElementById('nameSearch').value.trim();

    receptionSearchKeyword = keyword;

   if (!receptionListLoaded) {
       pendingNameSearch = true;
       return;
   }
  
    const normalizedKeyword = keyword
        .replace(/\s/g, '')
        .toLowerCase();

    const filteredParticipants = receptionListData.filter(function(participant) {
        const name = String(participant.name || '')
            .replace(/\s/g, '')
            .toLowerCase();

        const kana = String(participant.kana || '')
            .replace(/\s/g, '')
            .toLowerCase();

        const matchesSearch =
            normalizedKeyword === '' ||
            name.includes(normalizedKeyword) ||
            kana.includes(normalizedKeyword);

        return matchesSearch;
    });

    const listArea = document.getElementById('nameSearchResults');

    listArea.replaceChildren();

    const summary = document.createElement('p');
    summary.textContent =
        '参加者：' +
        receptionListData.length +
        '名 ／ 表示：' +
        filteredParticipants.length +
        '名';

    listArea.appendChild(summary);
       
    if (filteredParticipants.length === 0) {
        const noResults = document.createElement('p');
        noResults.textContent = '該当する参加者が見つかりませんでした。';
        noResults.className = 'reception-no-results';
        listArea.appendChild(noResults);
    } else {
        renderReceptionList(filteredParticipants, listArea);
    }
  }
    
  function showParticipant(participant, method = '手動') {
      const detailArea =
          document.getElementById('participantDetailArea');
  
      detailArea.innerHTML =
          '氏名：' + participant.name + '<br>' +
          '期数：' + participant.term + '<br>' +
          '懇親会：' + (participant.partyStatus || '参加') + '<br>' +
          '受付状況：' + participant.receptionStatus;
  
      renderReceptionAction(
          participant,
          detailArea,
          method
      );
  
      showScreen('detailScreen');
  }

    function loadReceptionList() {
      const listArea = document.getElementById('receptionListArea');
    
      listArea.textContent = '受付一覧を読み込み中...';
    
      const callbackName = 'receptionListCallback_' + Date.now();
    
      window[callbackName] = function(participants) {
        console.log(participants);
        
        receptionListData = participants;
        receptionListLoaded = true;

        const totalCount = participants.length;
        const checkedInCount = participants.filter(function(participant) {
            return participant.receptionStatus === '受付済';
        }).length;
        const pendingCount = totalCount - checkedInCount;
        
        document.getElementById('totalCount').textContent = totalCount;
        document.getElementById('checkedInCount').textContent = checkedInCount;
        document.getElementById('pendingCount').textContent = pendingCount;

        if (pendingNameSearch) {
            pendingNameSearch = false;
            searchParticipantsByName();
        }

        receptionListData.sort(function(a, b) {
          const valueA = String(a.kana || '');
          const valueB = String(b.kana || '');
        
          return valueA.localeCompare(
            valueB,
            'ja',
            { numeric: true }
          );
        });
      
        listArea.replaceChildren();
      
        const summary = document.createElement('p');
        summary.textContent = '参加者：' + participants.length + '名';
        listArea.appendChild(summary);

        renderReceptionFilterControls(listArea);
        renderReceptionList(receptionListData, listArea);
      
        delete window[callbackName];
        script.remove();
      };
    
      const script = document.createElement('script');
    
      script.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=list' +
        '&callback=' + encodeURIComponent(callbackName);
    
      script.onerror = function() {
        listArea.textContent = '受付一覧の取得に失敗しました。';
    
        delete window[callbackName];
        script.remove();
      };
    
      document.body.appendChild(script);
    }

    let receptionListData = [];
    let receptionListLoaded = false;
    let pendingNameSearch = false;
    
    let receptionSortKey = 'kana';
    let receptionSortDirection = 'asc';
    let receptionFilter = 'all';
    let receptionSearchKeyword = '';
    
    
    function renderReceptionList(participants, listArea) {
      const table = document.createElement('table');
      table.className = 'reception-list-table';
  
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
  
      const headers = ['受付', '氏名', '期数', 'パート', '受付時刻'];
  
      headers.forEach(function(headerText) {
          const th = document.createElement('th');
          th.textContent = headerText;
      
          if (headerText === '氏名') {
              th.style.cursor = 'pointer';
      
              if (receptionSortKey === 'kana') {
                  th.textContent =
                      '氏名' +
                      (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
              }
      
              th.onclick = function(event) {
                  event.stopPropagation();
                  sortReceptionList('kana');
              };
          }

        if (headerText === '期数') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'term') {
                th.textContent =
                    '期数' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('term');
            };
        }

        if (headerText === 'パート') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'part') {
                th.textContent =
                    'パート' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('part');
            };
        }

        if (headerText === '受付') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'receptionStatus') {
                th.textContent =
                    '受付' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('receptionStatus');
            };
        }

        if (headerText === '受付時刻') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'receptionTime') {
                th.textContent =
                    '受付時刻' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('receptionTime');
            };
        }
      
          headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);
      
      participants.forEach(function(participant) {
      const row = document.createElement('tr');

      row.style.cursor = 'pointer';

      row.onclick = function() {
          showParticipant(participant);
      };
  
      const statusCell = document.createElement('td');

      const statusIcon = document.createElement('span');
      statusIcon.className =
          participant.receptionStatus === '受付済'
              ? 'reception-status reception-status-done'
              : 'reception-status reception-status-pending';
      
      statusIcon.textContent =
          participant.receptionStatus === '受付済' ? '✓' : '−';
      
      statusCell.appendChild(statusIcon);
  
      const nameCell = document.createElement('td');
      nameCell.textContent = participant.name;
  
      const termCell = document.createElement('td');
      termCell.textContent = String(participant.term || '').split('（')[0];
  
      const partCell = document.createElement('td');
      partCell.textContent = participant.part;
  
      const receptionTimeCell = document.createElement('td');
        
      if (participant.receptionTime) {
          const receptionDate = new Date(participant.receptionTime);
      
          receptionTimeCell.textContent =
              receptionDate.toLocaleTimeString('ja-JP', {
                  hour: '2-digit',
                  minute: '2-digit',
                  hour12: false,
                  timeZone: 'Asia/Tokyo'
              });
      } else {
          receptionTimeCell.textContent = '－';
      }
  
      row.appendChild(statusCell);
      row.appendChild(nameCell);
      row.appendChild(termCell);
      row.appendChild(partCell);
      row.appendChild(receptionTimeCell);
  
      table.appendChild(row);
  });
  
  listArea.appendChild(table);
    }

    function sortReceptionList(key) {
      if (receptionSortKey === key) {
        receptionSortDirection =
          receptionSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        receptionSortKey = key;
        receptionSortDirection = 'asc';
      }

      receptionListData.sort(function(a, b) {
        const partOrder = {
          'ソプラノ1': 1,
          'ソプラノ2': 2,
          'アルト1': 3,
          'アルト2': 4,
          'テノール1': 5,
          'テノール2': 6,
          'バス1': 7,
          'バス2': 8
        };
        
        if (receptionSortKey === 'part') {
          const orderA = partOrder[a.part] || 999;
          const orderB = partOrder[b.part] || 999;
        
          return receptionSortDirection === 'asc'
            ? orderA - orderB
            : orderB - orderA;
        }
        const valueA = String(a[receptionSortKey] || '');
        const valueB = String(b[receptionSortKey] || '');
    
        const comparison = valueA.localeCompare(
          valueB,
          'ja',
          { numeric: true }
        );
    
        return receptionSortDirection === 'asc'
          ? comparison
          : -comparison;
      });

      const listArea = document.getElementById('receptionListArea');

      receptionFilter = 'all';
      
      listArea.replaceChildren();
    
      const summary = document.createElement('p');
      summary.textContent = '参加者：' + receptionListData.length + '名';
      listArea.appendChild(summary);

      renderReceptionFilterControls(listArea);
      (listArea);
      
      renderReceptionList(receptionListData, listArea);
      }

    function renderReceptionFilterControls(listArea) {
        const controls = document.createElement('div');
        controls.className = 'reception-filter-controls';
    
        const doneCount = receptionListData.filter(function(participant) {
            return participant.receptionStatus === '受付済';
        }).length;
        
        const pendingCount = receptionListData.length - doneCount;
        
        const filters = [
            { key: 'all', label: 'すべて ' + receptionListData.length },
            { key: 'done', label: '受付済 ' + doneCount },
            { key: 'pending', label: '未受付 ' + pendingCount }
        ];
    
        filters.forEach(function(filter) {
            const button = document.createElement('button');
            button.type = 'button';
            button.classList.add('reception-filter-button');
            button.textContent = filter.label;

            if (receptionFilter === filter.key) {
                button.classList.add('active');
            }  
    
            button.onclick = function() {
                receptionFilter = filter.key;
            
                const filteredParticipants = receptionListData.filter(function(participant) {
                    if (receptionFilter === 'done') {
                        return participant.receptionStatus === '受付済';
                    }
            
                    if (receptionFilter === 'pending') {
                        return participant.receptionStatus !== '受付済';
                    }
            
                    return true;
                });
            
                listArea.replaceChildren();
            
                const summary = document.createElement('p');
                summary.textContent = '参加者：' + receptionListData.length + '名';
                listArea.appendChild(summary);
            
                renderReceptionFilterControls(listArea);      
                renderReceptionList(filteredParticipants, listArea);
            };    
            controls.appendChild(button);
        });
    
        listArea.appendChild(controls);
    }
    
  

    window.addEventListener('DOMContentLoaded', function() {
    loadReceptionList();
    });
    
  </script>

</body>
