    body {

    .qr-scanner-wrapper {

    }
    
    #qr-reader {
        width: 100%;
        margin: 0;
        border: none !important;
        border-radius: 18px;
        overflow: hidden;
        background: #111111;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    
   #qr-reader video {
        display: block;
        width: 100% !important;
        height: clamp(320px, 88vw, 460px) !important;
        object-fit: cover;
        border-radius: 18px;
    }
    
    .qr-scan-frame {
    --qr-frame-color: #ffffff;

    position: absolute;
    top: 50%;
    left: 50%;
    width: 250px;
    height: 250px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.15s ease;

    background:
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left top / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left top / 6px 46px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right top / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right top / 6px 46px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left bottom / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) left bottom / 6px 46px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right bottom / 46px 6px no-repeat,
        linear-gradient(var(--qr-frame-color), var(--qr-frame-color)) right bottom / 6px 46px no-repeat;
}
    
    .qr-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 0;
        font-size: 14px;
        font-weight: 500;
        color: #666666;
    }
    
    .qr-status::before {
        content: "";
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        border-radius: 50%;
        background: #9ca3af;
        animation: qr-status-pulse 1.4s ease-in-out infinite;
    }

      @keyframes qr-status-pulse {
          0%,
          100% {
              opacity: 0.45;
              transform: scale(0.9);
          }
      
          50% {
              opacity: 1;
              transform: scale(1);
          }
      }

    .qr-status.is-success {
        align-items: flex-start;
        padding: 14px 16px;
        border: 1px solid #bbf7d0;
        border-radius: 12px;
        background: #f0fdf4;
        color: #166534;
        font-weight: 600;
        line-height: 1.6;
        white-space: pre-line;
    }
    
    .qr-status.is-success::before {
        content: "✓";
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin-top: 1px;
        border-radius: 50%;
        background: #16a34a;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        animation: qr-success-pop 0.4s ease-out;
    }

    @keyframes qr-success-pop {
        0% {
            transform: scale(0.7);
            opacity: 0;
        }
    
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    #qr-shaded-region > div {
        display: none !important;
    }

    .qr-scan-frame.is-visible {
        opacity: 1;
    }

    .qr-scan-frame.is-success {
        --qr-frame-color: #16a34a;
    }

    #qr-reader__scan_region {
        border-radius: 18px;
        overflow: hidden;
    }
    
    #qr-reader__scan_region > div {
        border-color: #16a34a !important;
    }

    .participant-flip-container {
        margin: 20px 0 16px;
        perspective: 1200px;
    }
    
    .participant-flip-inner {
        display: grid;
        transform-style: preserve-3d;
        transition: transform 0.8s ease-in-out;
    }
    
    .participant-flip-front,
    .participant-flip-back {
        grid-area: 1 / 1;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }
    
    .participant-flip-front {
        transform: rotateY(0deg);
    }
    
    .participant-flip-back {
        transform: rotateY(180deg);
    }
    
    .participant-flip-container.is-flipped .participant-flip-inner {
        transform: rotateY(180deg);
    }
    
    .participant-flip-front .participant-card {

    <button type="button" class="back-button" onclick="showHomeScreen()">
        ← 受付メニューに戻る
    </button>

    <h2 class="search-screen-title">名前で検索</h2>

    <p class="search-screen-description">
        参加者の氏名またはふりがなを入力してください
    </p>

    <div class="search-input-wrapper">
        <span class="search-input-icon" aria-hidden="true">⌕</span>

        <input
            type="text"
            id="nameSearch"
            placeholder="氏名・ふりがなで検索"
        >
    </div>

    <button
        type="button"
        id="nameSearchButton"
        class="search-submit-button"
        onclick="searchParticipantsByName()"
    >
        検索する
    </button>

    <div id="nameSearchResults"></div>

</div>

<div id="detailScreen" style="display: none;">

    <button type="button" id="detailBackButton" class="back-button" onclick="returnFromDetail()">
        ← 前の画面に戻る
    </button>

    <h2>参加者詳細</h2>

    <div id="participantDetailArea"></div>

</div>
  
<div id="listScreen" style="display: none;">

  <button type="button" class="back-button" onclick="showHomeScreen()">
    ← 受付メニューに戻る
  </button>
  
 <h2>受付一覧</h2>

 
  <div id="receptionListArea"></div>

  </div>
  
  <script>

   function showScreen(screenId) {
    if (screenId === 'detailScreen') {
        const currentScreen = [
            'homeScreen',
            'qrScreen',
            'searchScreen',
            'listScreen'
        ].find(function(id) {
            const screen = document.getElementById(id);
            return screen && screen.style.display !== 'none';
        });

        if (currentScreen) {
            detailReturnScreen = currentScreen;
        }
    }

    const screenIds = [
            'homeScreen',
            'qrScreen',
            'searchScreen',
            'listScreen',
            'detailScreen'
        ];
    
        screenIds.forEach(function(id) {
            const screen = document.getElementById(id);
    
            if (id === screenId) {
                screen.style.display = 'block';
            } else {
                screen.style.display = 'none';
            }
        });
    }

    let detailReturnScreen = 'homeScreen';

    function showListScreen() {
        showScreen('listScreen');
    }

    function showQrScreen() {
        showScreen('qrScreen');
        startQrScanner();
    }

    function showSearchScreen() {
        showScreen('searchScreen');
    }

    function showHomeScreen() {
        showScreen('homeScreen');
    }

    function returnFromDetail() {
        if (detailReturnScreen === 'listScreen') {
            showListScreen();
            return;
        }
    
        if (detailReturnScreen === 'searchScreen') {
            showSearchScreen();
            return;
        }
    
        if (detailReturnScreen === 'qrScreen') {
            showQrScreen();
            return;
        }
    
        showHomeScreen();
    }

    function returnFromDetail() {
        if (detailReturnScreen === 'listScreen') {
            showListScreen();
            return;
        }
    
        if (detailReturnScreen === 'searchScreen') {
            showSearchScreen();
            return;
        }
    
        if (detailReturnScreen === 'qrScreen') {
            showQrScreen();
            return;
        }
    
        showHomeScreen();
    }
    
    function renderReceptionAction(
    participant,
    targetArea = document.getElementById('qr-result'),
    method = 'QR'
    ) {
    const qrResult = targetArea;

    qrResult.replaceChildren();

    if (participant.receptionStatus !== '受付済') {
        const checkInButton = document.createElement('button');
        checkInButton.textContent = '受付する';
        checkInButton.className = 'reception-action-button reception-checkin-button';
        
        checkInButton.onclick = function() {
          executeCheckIn(participant, method, targetArea, checkInButton);
        };
        
        
        qrResult.appendChild(checkInButton);
      } else {
          const cancelButton = document.createElement('button');
          cancelButton.textContent = '受付取消';
          cancelButton.className = 'reception-action-button reception-cancel-button';
          
          cancelButton.onclick = function() {
              executeCancel(participant, method, targetArea, cancelButton);
          };
          
          qrResult.appendChild(cancelButton);
      }
    }

    function executeCheckIn(participant, method = 'QR', targetArea = document.getElementById('qr-result'), checkInButton) {
    const qrResult = targetArea;
    
      checkInButton.disabled = true;
      checkInButton.textContent = '受付処理中...';

      const callbackName = 'checkInCallback_' + Date.now();

      window[callbackName] = function(result) {
        if (result.success) {
          participant.receptionStatus = '受付済';
      
         const flipContainer = document.querySelector('.participant-flip-container');
         const flipBack = flipContainer.querySelector('.participant-flip-back');
          
         flipBack.innerHTML =
              '<div class="reception-complete-card">' +
                  '<div class="reception-complete-icon">✓</div>' +
                  '<div class="reception-complete-title">受付完了！</div>' +
                  '<div class="reception-complete-description">参加者の受付が完了しました</div>' +
                  '<div class="reception-complete-info">' +
                      '<div class="reception-complete-row">' +
                          '<span>氏名</span>' +
                          '<strong></strong>' +
                      '</div>' +
                      '<div class="reception-complete-row">' +
                          '<span>受付時刻</span>' +
                          '<strong></strong>' +
                      '</div>' +
                  '</div>' +
              '</div>';
          
         const completeValues = flipBack.querySelectorAll('.reception-complete-row strong');
          completeValues[0].textContent = result.name;
          completeValues[1].textContent = result.time;
          
         flipContainer.classList.add('is-flipped');

          const actionArea = document.getElementById('receptionActionArea');
          renderReceptionAction(participant, actionArea, method);
          
          loadReceptionList();
        } else {
          checkInButton.disabled = false;
          checkInButton.textContent = '受付する';
          alert(result.message);
        }
      };

      const script = document.createElement('script');
      
      script.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=checkin' +
        '&id=' + encodeURIComponent(participant.receptionId) +
        '&method=' + encodeURIComponent(method) +
        '&callback=' + encodeURIComponent(callbackName);
      
      document.body.appendChild(script);
      
    }

    function executeCancel(participant, method = 'QR', targetArea = document.getElementById('qr-result'), cancelButton) {
    const confirmed = confirm(participant.name + ' 様の受付を取り消してよろしいですか？');

    if (!confirmed) {
        return;
    }

    const qrResult = targetArea;    
        cancelButton.disabled = true;
        cancelButton.textContent = '取消処理中...';


        const callbackName = 'cancelCallback_' + Date.now();
        
        window[callbackName] = function(result) {
            if (result.success) {
                participant.receptionStatus = '未受付';
        
                const flipContainer = document.querySelector('.participant-flip-container');

              const statusElement = flipContainer.querySelector('.participant-status');

              if (statusElement) {
                  statusElement.className = 'participant-status is-pending';
              
                  statusElement.querySelector('.participant-status-icon').textContent = '－';
                  statusElement.querySelector('span:last-child').textContent = '未受付';
              }

                flipContainer.classList.remove('is-flipped');
                
                const actionArea = document.getElementById('receptionActionArea');
                renderReceptionAction(participant, actionArea, method);
                
                loadReceptionList();
            } else {
                cancelButton.disabled = false;
                cancelButton.textContent = '受付取消';
                alert(result.message);
            }
            delete window[callbackName];
            script.remove();
          
        };

        const script = document.createElement('script');
        
        script.src =
            'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
            '?api=cancel' +
            '&id=' + encodeURIComponent(participant.receptionId) +
            '&method=' + encodeURIComponent(method) +
            '&callback=' + encodeURIComponent(callbackName);
        
        document.body.appendChild(script);
      
    }
    
    async function startQrScanner() {
        const qrResult = document.getElementById('qr-result');
        const qrReader = document.getElementById('qr-reader');
        const qrScanFrame = document.querySelector('.qr-scan-frame');
        
        qrScanFrame.classList.remove('is-visible');
        qrScanFrame.classList.remove('is-success');
        qrResult.classList.remove('is-success');
        
        qrReader.replaceChildren();
        qrReader.style.display = 'block';
        
        qrResult.textContent = 'QRリーダー起動中...';
      
        qrReader.style.display = 'block';
        qrResult.textContent = 'QRリーダー起動中...';
      
      
        const scanner = new Html5Qrcode('qr-reader');
        let qrDetected = false;
      
        try {
            await scanner.start(
              { facingMode: 'environment' },
              {
                fps: 10,
                qrbox: {
                  width: 250,
                  height: 250
                }
              },
           async function(decodedText) {
            if (qrDetected) {
                return;
            }
        
            qrDetected = true;
            
            qrScanFrame.classList.add('is-visible');
            qrScanFrame.classList.add('is-success');
            qrResult.textContent = 'QRコードを認識しました';
            
            if ('vibrate' in navigator) {
                navigator.vibrate(60);
            }
        
            await new Promise(function(resolve) {
                setTimeout(resolve, 450);
            });
            
            qrScanFrame.classList.remove('is-visible');
            
            await new Promise(function(resolve) {
                setTimeout(resolve, 180);
            });
            
            await scanner.stop().catch(function(error) {
                console.error(error);
            });
            
            scanner.clear();
            
            qrScanFrame.classList.remove('is-success');
            qrReader.replaceChildren();
            qrReader.style.display = 'none';
        
             
             try {
                 const url = new URL(decodedText);
                 const receptionId = url.searchParams.get('id');
              
                if (!receptionId) {
                    throw new Error('受付IDがURLに含まれていません');
                }
                     
          qrResult.classList.add('is-success');
          qrResult.textContent =
              'QRコードを認識しました\n' +
              '参加者情報を確認しています...';

          const successShownAt = Date.now();
    
        const callbackName = 'participantCallback_' + Date.now();
    
      window[callbackName] = async function(participant) {
          if (participant.success) {
              const elapsed = Date.now() - successShownAt;
              const remaining = Math.max(0, 800 - elapsed);
      
              if (remaining > 0) {
                  await new Promise(function(resolve) {
                      setTimeout(resolve, remaining);
                  });
              }
      
              showParticipant(participant, 'QR');
        } else {
          
        qrResult.textContent =
            '参加者を確認できませんでした。\n' +
            participant.message;
    }

    delete window[callbackName];
    script.remove();
};

    const script = document.createElement('script');
    
    script.src =
      'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
      '?api=participant' +
      '&id=' + encodeURIComponent(receptionId) +
      '&callback=' + encodeURIComponent(callbackName);
    
    script.onerror = function() {
        qrResult.innerHTML +=
            '<br>参加者情報の取得に失敗しました。';
    
        delete window[callbackName];
        script.remove();
    };

    document.body.appendChild(script);

} catch (error) {
qrResult.textContent =
    'QRコードの解析に失敗しました。\n' +
    '読み取り内容：' + decodedText;
}
},
      function() {
        // QRをまだ認識していない間は何もしない
      }
    );

  if (!qrDetected) {
      qrScanFrame.classList.add('is-visible');
      qrResult.textContent = '読み取り待機中';
  }
          
  } catch (error) {
    qrReader.style.display = 'none';
          
    qrResult.textContent =
      'QRリーダー起動失敗\n' +
      'name: ' + (error.name || '不明') + '\n' +
      'message: ' + (error.message || String(error));

    console.error(error);
  }
}

function searchParticipantsByName() {
    const keyword = document.getElementById('nameSearch').value.trim();

    receptionSearchKeyword = keyword;

   if (!receptionListLoaded) {
       pendingNameSearch = true;
       return;
   }
  
    const normalizedKeyword = keyword
        .replace(/\s/g, '')
        .toLowerCase();

    const filteredParticipants = receptionListData.filter(function(participant) {
        const name = String(participant.name || '')
            .replace(/\s/g, '')
            .toLowerCase();

        const kana = String(participant.kana || '')
            .replace(/\s/g, '')
            .toLowerCase();

        const matchesSearch =
            normalizedKeyword === '' ||
            name.includes(normalizedKeyword) ||
            kana.includes(normalizedKeyword);

        return matchesSearch;
    });

    const listArea = document.getElementById('nameSearchResults');

    listArea.replaceChildren();

    const summary = document.createElement('p');
    summary.textContent =
        '参加者：' +
        receptionListData.length +
        '名 ／ 表示：' +
        filteredParticipants.length +
        '名';

    listArea.appendChild(summary);
       
    if (filteredParticipants.length === 0) {
        const noResults = document.createElement('p');
        noResults.textContent = '該当する参加者が見つかりませんでした。';
        noResults.className = 'reception-no-results';
        listArea.appendChild(noResults);
    } else {
        renderReceptionList(filteredParticipants, listArea);
    }
  }
    
  function showParticipant(participant, method = '手動') {
    const currentScreen = document.querySelector('.screen:not([style*="display: none"])');

    if (currentScreen && currentScreen.id !== 'detailScreen') {
        detailReturnScreen = currentScreen.id;
    }

    const detailArea =
        document.getElementById('participantDetailArea');
  
      detailArea.innerHTML =
          '<div class="participant-flip-container">' +
              '<div class="participant-flip-inner">' +
                  '<div class="participant-flip-front">' +
                      '<div class="participant-card">' +
          '<div class="participant-card-name">' + participant.name + '</div>' +
          '<div class="participant-card-info">' +
              '<div class="participant-info-row">' +
                  '<span class="participant-info-label">期数</span>' +
                  '<span class="participant-info-value">' + (participant.term || '－') + '</span>' +
              '</div>' +
              '<div class="participant-info-row">' +
                  '<span class="participant-info-label">懇親会</span>' +
                  '<span class="participant-info-value">' + (participant.partyStatus || '参加') + '</span>' +
              '</div>' +
              '<div class="participant-info-row">' +
                  '<span class="participant-info-label">受付状況</span>' +
                  '<span class="participant-status ' +
                      (participant.receptionStatus === '受付済' ? 'is-checked-in' : 'is-pending') +
                  '">' +
                      '<span class="participant-status-icon">' +
                          (participant.receptionStatus === '受付済' ? '✓' : '−') +
                      '</span>' +
                      '<span>' +
                          (participant.receptionStatus === '受付済' ? '受付済' : '未受付') +
                      '</span>' +
                  '</span>' +
              '</div>' +
                  '</div>' +
              '</div>' +
              '</div>' +
              '<div class="participant-flip-back"></div>' +
              '</div>' +
              '</div>';
  
      const actionArea = document.createElement('div');
      actionArea.id = 'receptionActionArea';
      
      detailArea.appendChild(actionArea);
      
      renderReceptionAction(
          participant,
          actionArea,
          method
      );
  
      showScreen('detailScreen');
  }

    function loadReceptionList() {
      const listArea = document.getElementById('receptionListArea');
    
      listArea.textContent = '受付一覧を読み込み中...';
    
      const callbackName = 'receptionListCallback_' + Date.now();
    
      window[callbackName] = function(participants) {
        console.log(participants);
        
        receptionListData = participants;
        receptionListLoaded = true;

        const totalCount = participants.length;
        const checkedInCount = participants.filter(function(participant) {
            return participant.receptionStatus === '受付済';
        }).length;
        const pendingCount = totalCount - checkedInCount;
        
        document.getElementById('totalCount').textContent = totalCount;
        document.getElementById('checkedInCount').textContent = checkedInCount;
        document.getElementById('pendingCount').textContent = pendingCount;

        if (pendingNameSearch) {
            pendingNameSearch = false;
            searchParticipantsByName();
        }

        receptionListData.sort(function(a, b) {
          const valueA = String(a.kana || '');
          const valueB = String(b.kana || '');
        
          return valueA.localeCompare(
            valueB,
            'ja',
            { numeric: true }
          );
        });
      
        listArea.replaceChildren();
      
        const summary = document.createElement('p');
        summary.textContent = '参加者：' + participants.length + '名';
        listArea.appendChild(summary);

        renderReceptionFilterControls(listArea);
        renderReceptionList(receptionListData, listArea);
      
        delete window[callbackName];
        script.remove();
      };
    
      const script = document.createElement('script');
    
      script.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=list' +
        '&callback=' + encodeURIComponent(callbackName);
    
      script.onerror = function() {
        listArea.textContent = '受付一覧の取得に失敗しました。';
    
        delete window[callbackName];
        script.remove();
      };
    
      document.body.appendChild(script);
    }

    let receptionListData = [];
    let receptionListLoaded = false;
    let pendingNameSearch = false;
    
    let receptionSortKey = 'kana';
    let receptionSortDirection = 'asc';
    let receptionFilter = 'all';
    let receptionSearchKeyword = '';
    
    
    function renderReceptionList(participants, listArea) {
      const table = document.createElement('table');
      table.className = 'reception-list-table';
  
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
  
      const headers = ['受付', '氏名', '期数', 'パート', '受付時刻'];
  
      headers.forEach(function(headerText) {
          const th = document.createElement('th');
          th.textContent = headerText;
      
          if (headerText === '氏名') {
              th.style.cursor = 'pointer';
      
              if (receptionSortKey === 'kana') {
                  th.textContent =
                      '氏名' +
                      (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
              }
      
              th.onclick = function(event) {
                  event.stopPropagation();
                  sortReceptionList('kana');
              };
          }

        if (headerText === '期数') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'term') {
                th.textContent =
                    '期数' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('term');
            };
        }

        if (headerText === 'パート') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'part') {
                th.textContent =
                    'パート' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('part');
            };
        }

        if (headerText === '受付') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'receptionStatus') {
                th.textContent =
                    '受付' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('receptionStatus');
            };
        }

        if (headerText === '受付時刻') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'receptionTime') {
                th.textContent =
                    '受付時刻' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('receptionTime');
            };
        }
      
          headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);
      
      participants.forEach(function(participant) {
      const row = document.createElement('tr');

      row.style.cursor = 'pointer';

      row.onclick = function() {
          showParticipant(participant);
      };
  
      const statusCell = document.createElement('td');

      const statusIcon = document.createElement('span');
      statusIcon.className =
          participant.receptionStatus === '受付済'
              ? 'reception-status reception-status-done'
              : 'reception-status reception-status-pending';
      
      statusIcon.textContent =
          participant.receptionStatus === '受付済' ? '✓' : '−';
      
      statusCell.appendChild(statusIcon);
  
      const nameCell = document.createElement('td');
      nameCell.textContent = participant.name;
  
      const termCell = document.createElement('td');
      termCell.textContent = String(participant.term || '').split('（')[0];
  
      const partCell = document.createElement('td');
      partCell.textContent = participant.part;
  
      const receptionTimeCell = document.createElement('td');
        
      if (participant.receptionTime) {
          const receptionDate = new Date(participant.receptionTime);
      
          receptionTimeCell.textContent =
              receptionDate.toLocaleTimeString('ja-JP', {
                  hour: '2-digit',
                  minute: '2-digit',
                  hour12: false,
                  timeZone: 'Asia/Tokyo'
              });
      } else {
          receptionTimeCell.textContent = '－';
      }
  
      row.appendChild(statusCell);
      row.appendChild(nameCell);
      row.appendChild(termCell);
      row.appendChild(partCell);
      row.appendChild(receptionTimeCell);
  
      table.appendChild(row);
  });
  
  const scrollArea = document.createElement('div');
  scrollArea.className = 'reception-list-scroll';
  
  scrollArea.appendChild(table);
  listArea.appendChild(scrollArea);
    }

    function sortReceptionList(key) {
      if (receptionSortKey === key) {
        receptionSortDirection =
          receptionSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        receptionSortKey = key;
        receptionSortDirection = 'asc';
      }

      receptionListData.sort(function(a, b) {
        const partOrder = {
          'ソプラノ1': 1,
          'ソプラノ2': 2,
          'アルト1': 3,
          'アルト2': 4,
          'テノール1': 5,
          'テノール2': 6,
          'バス1': 7,
          'バス2': 8
        };
        
        if (receptionSortKey === 'part') {
          const orderA = partOrder[a.part] || 999;
          const orderB = partOrder[b.part] || 999;
        
          return receptionSortDirection === 'asc'
            ? orderA - orderB
            : orderB - orderA;
        }
        const valueA = String(a[receptionSortKey] || '');
        const valueB = String(b[receptionSortKey] || '');
    
        const comparison = valueA.localeCompare(
          valueB,
          'ja',
          { numeric: true }
        );
    
        return receptionSortDirection === 'asc'
          ? comparison
          : -comparison;
      });

      const listArea = document.getElementById('receptionListArea');

      receptionFilter = 'all';
      
      listArea.replaceChildren();
    
      const summary = document.createElement('p');
      summary.textContent = '参加者：' + receptionListData.length + '名';
      listArea.appendChild(summary);

      renderReceptionFilterControls(listArea);
      (listArea);
      
      renderReceptionList(receptionListData, listArea);

      const scrollArea = listArea.querySelector('.reception-list-scroll');
      if (scrollArea) {
          scrollArea.scrollTop = 0;
      }
      }

    function renderReceptionFilterControls(listArea) {
        const controls = document.createElement('div');
        controls.className = 'reception-filter-controls';
    
        const doneCount = receptionListData.filter(function(participant) {
            return participant.receptionStatus === '受付済';
        }).length;
        
        const pendingCount = receptionListData.length - doneCount;
        
        const filters = [
            { key: 'all', label: 'すべて ' + receptionListData.length },
            { key: 'done', label: '受付済 ' + doneCount },
            { key: 'pending', label: '未受付 ' + pendingCount }
        ];
    
        filters.forEach(function(filter) {
            const button = document.createElement('button');
            button.type = 'button';
            button.classList.add('reception-filter-button');
            button.textContent = filter.label;

            if (receptionFilter === filter.key) {
                button.classList.add('active');
            }  
    
            button.onclick = function() {
                receptionFilter = filter.key;
            
                const filteredParticipants = receptionListData.filter(function(participant) {
                    if (receptionFilter === 'done') {
                        return participant.receptionStatus === '受付済';
                    }
            
                    if (receptionFilter === 'pending') {
                        return participant.receptionStatus !== '受付済';
                    }
            
                    return true;
                });
            
                listArea.replaceChildren();
            
                const summary = document.createElement('p');
                summary.textContent = '参加者：' + receptionListData.length + '名';
                listArea.appendChild(summary);
            
                renderReceptionFilterControls(listArea);      
                renderReceptionList(filteredParticipants, listArea);
            };    
            controls.appendChild(button);
        });
    
        listArea.appendChild(controls);
    }
    
  

    window.addEventListener('DOMContentLoaded', function() {
    loadReceptionList();
    });
    
  </script>

</body>
</html>
