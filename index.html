<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBOG受付 カメラテスト</title>
　<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin: 16px 0;
    }

    #result {
      white-space: pre-wrap;
    }

    video {
      width: 100%;
      margin-top: 16px;
      background: #000;
    }
  </style>
</head>

<body>

  <h1>OBOG受付 カメラテスト</h1>

  <p>
    GitHub Pages上でgetUserMedia()をテストします。
  </p>

  <button type="button" onclick="startCamera()">
    📷 カメラを起動
  </button>
  
  <button type="button" onclick="startQrScanner()">
    🔍 QRコードを読み取る
  </button>
  
  <p id="result">待機中</p>

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="qr-reader"></div>

  <p id="qr-result">QR読み取り待機中</p>

  <hr>

  <h2>名前で検索</h2>
  
  <label for="nameSearch">氏名・ふりがな</label>
  
  <input
    type="text"
    id="nameSearch"
    placeholder="氏名またはふりがなを入力">
  
  <button type="button" id="nameSearchButton" onclick="searchParticipantsByName()">
  名前で検索
  </button>
  
  <div id="nameSearchResults"></div>
  
  <script>
    async function startCamera() {
      const result = document.getElementById('result');
      const video = document.getElementById('camera');

      result.textContent = 'カメラ起動中...';

      try {
        if (!navigator.mediaDevices) {
          throw new Error('navigator.mediaDevices が利用できません');
        }

        if (!navigator.mediaDevices.getUserMedia) {
          throw new Error('getUserMedia が利用できません');
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment'
            },
            audio: false
          });

        video.srcObject = stream;

        result.textContent =
          '成功：カメラを取得できました！';

      } catch (error) {
        result.textContent =
          '失敗\n' +
          'name: ' + (error.name || '不明') + '\n' +
          'message: ' + (error.message || String(error));

        console.error(error);
      }
    }
    async function startQrScanner() {
  const qrResult = document.getElementById('qr-result');

  qrResult.textContent = 'QRリーダー起動中...';

  const scanner = new Html5Qrcode('qr-reader');

  try {
    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
   function(decodedText) {
     scanner.stop().catch(function(error) {
       console.error(error);
     });
     
     try {
    const url = new URL(decodedText);
    const receptionId = url.searchParams.get('id');

    if (!receptionId) {
      throw new Error('受付IDがURLに含まれていません');
    }

    qrResult.textContent =
  'QR読み取り成功！\n' +
  '受付ID：' + receptionId +
  '\n参加者情報を確認しています...';

const callbackName = 'participantCallback_' + Date.now();

window[callbackName] = function(participant) {
  if (participant.success) {
  qrResult.innerHTML =
    '参加者確認完了！<br><br>' +
    '氏名：' + participant.name + '<br>' +
    '期数：' + participant.term + '<br>' +
    '懇親会：' + participant.partyStatus + '<br>' +
    '受付状況：' + participant.receptionStatus + '<br><br>';

  if (participant.receptionStatus !== '受付済') {
    const checkInButton = document.createElement('button');
    checkInButton.textContent = '受付する';
    checkInButton.id = 'checkInButton';
    
    checkInButton.onclick = function() {
      checkInButton.disabled = true;
      checkInButton.textContent = '受付処理中...';
    
      const checkInCallbackName = 'checkInCallback_' + Date.now();
    
      window[checkInCallbackName] = function(result) {
        if (result.success) {
          qrResult.innerHTML =
            '✓ 受付完了！<br><br>' +
            '氏名：' + result.name + '<br>' +
            '受付時刻：' + result.time;
        } else {
          checkInButton.disabled = false;
          checkInButton.textContent = '受付する';
          alert(result.message);
        }
    
        delete window[checkInCallbackName];
        checkInScript.remove();
      };
    
      const checkInScript = document.createElement('script');
    
      checkInScript.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=checkin' +
        '&id=' + encodeURIComponent(receptionId) +
        '&callback=' + encodeURIComponent(checkInCallbackName);

      qrResult.innerHTML +=
        '<br><br>受付API URL：<a href="' + checkInScript.src + '" target="_blank">ここをタップ</a>';
      
      checkInScript.onerror = function() {
        checkInButton.disabled = false;
        checkInButton.textContent = '受付する';
      
        qrResult.innerHTML +=
          '<br><br>❌ 受付APIの呼び出しに失敗しました。';
      
        delete window[checkInCallbackName];
        checkInScript.remove();  
  };
      document.body.appendChild(checkInScript);
    };
    
    qrResult.appendChild(checkInButton);
  　
  　} else {
    
      const cancelButton = document.createElement('button');
      cancelButton.textContent = '受付取消';
      cancelButton.id = 'cancelButton';
      
      cancelButton.onclick = function() {
        cancelButton.disabled = true;
        cancelButton.textContent = '取消処理中...';
      
        const cancelCallbackName = 'cancelCallback_' + Date.now();
      
        window[cancelCallbackName] = function(result) {
          if (result.success) {
            qrResult.innerHTML =
              '✓ 受付取消完了<br><br>' +
              '氏名：' + result.name;
          } else {
            cancelButton.disabled = false;
            cancelButton.textContent = '受付取消';
            alert(result.message);
          }
      
          delete window[cancelCallbackName];
          cancelScript.remove();
        };
      
        const cancelScript = document.createElement('script');
      
        cancelScript.src =
          'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
          '?api=cancel' +
          '&id=' + encodeURIComponent(receptionId) +
          '&callback=' + encodeURIComponent(cancelCallbackName);
      
        cancelScript.onerror = function() {
          cancelButton.disabled = false;
          cancelButton.textContent = '受付取消';
      
          qrResult.innerHTML +=
            '<br><br>❌ 受付取消APIの呼び出しに失敗しました。';
      
          delete window[cancelCallbackName];
          cancelScript.remove();
        };
      
        document.body.appendChild(cancelScript);
      };
      
      qrResult.appendChild(cancelButton);
    }
  
    } else {
    qrResult.textContent =
      '参加者を確認できませんでした。\n' +
      participant.message;
  }

  delete window[callbackName];
  script.remove();
};

const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
  '?api=participant' +
  '&id=' + encodeURIComponent(receptionId) +
  '&callback=' + encodeURIComponent(callbackName);

qrResult.innerHTML +=
  '<br>API URL：<a href="' + script.src + '" target="_blank">ここをタップ</a>';
       
script.onerror = function() {
  qrResult.innerHTML +=
  '<br>参加者情報の取得に失敗しました。';

  delete window[callbackName];
  script.remove();
};

document.body.appendChild(script);
    
  } catch (error) {
    qrResult.textContent =
      'QRコードの解析に失敗しました。\n' +
      '読み取り内容：' + decodedText;
  }
},
      function() {
        // QRをまだ認識していない間は何もしない
      }
    );
  } catch (error) {
    qrResult.textContent =
      'QRリーダー起動失敗\n' +
      'name: ' + (error.name || '不明') + '\n' +
      'message: ' + (error.message || String(error));

    console.error(error);
  }
}

function searchParticipantsByName() { 
  const keyword =
    document.getElementById('nameSearch').value.trim();

  if (!keyword) {
    alert('氏名またはふりがなを入力してください。');
    return;
  }

  const callbackName = 'searchCallback_' + Date.now();

  window[callbackName] = function(results) {

    const resultsArea =
      document.getElementById('nameSearchResults');
  
    resultsArea.innerHTML = '';
  
    if (results.length === 0) {
      resultsArea.textContent =
        '該当する参加者が見つかりませんでした。';
      return;
    }

    results.forEach(function(participant) {
      const button = document.createElement('button');

      button.textContent =
        participant.name + '　-　' +
        participant.receptionStatus;

      button.onclick = function() {
        showParticipant(participant);
      };
      
      resultsArea.appendChild(button);
    });

    delete window[callbackName];
    
  };

    const script = document.createElement('script');

    script.src =
      'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
      '?api=search' +
      '&keyword=' + encodeURIComponent(keyword) +
      '&callback=' + encodeURIComponent(callbackName);

    script.onerror = function() {
      const resultsArea =
        document.getElementById('nameSearchResults');
  
      resultsArea.textContent =
        '参加者検索に失敗しました。';
  
      delete window[callbackName];
      script.remove();
    };

    document.body.appendChild(script);
  
  }
  
  function showParticipant(participant) {
    const resultsArea =
      document.getElementById('nameSearchResults');
  
    resultsArea.innerHTML =
      '氏名：' + participant.name + '<br>' +
      '期数：' + participant.term + '<br>' +
      '懇親会：' + participant.partyStatus + '<br>' +
      '受付状況：' + participant.receptionStatus;

    const actionButton = document.createElement('button');
  
    actionButton.textContent =
      participant.receptionStatus === '受付済'
        ? '受付を取り消す'
        : '受付する';

    actionButton.onclick = function() {
      if (participant.receptionStatus === '受付済') {
        actionButton.disabled = true;
        actionButton.textContent = '取消処理中...';
      
        const cancelCallbackName =
          'manualCancelCallback_' + Date.now();
      
        window[cancelCallbackName] = function(result) {
          if (result.success) {
            participant.receptionStatus = '未受付';
      
            showParticipant(participant);
            searchParticipantsByName();
      
            alert(
              result.name + ' 様の受付を取り消しました。'
            );
          } else {
            actionButton.disabled = false;
            actionButton.textContent = '受付を取り消す';
            alert(result.message);
          }
      
          delete window[cancelCallbackName];
          cancelScript.remove();
        };
      
        const cancelScript =
          document.createElement('script');
      
        cancelScript.src =
          'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
          '?api=cancel' +
          '&id=' + encodeURIComponent(participant.receptionId) +
          '&callback=' + encodeURIComponent(cancelCallbackName);
      
        cancelScript.onerror = function() {
          actionButton.disabled = false;
          actionButton.textContent = '受付を取り消す';
      
          alert('受付取消APIの呼び出しに失敗しました。');
      
          delete window[cancelCallbackName];
          cancelScript.remove();
        };
      
        document.body.appendChild(cancelScript);
        return;
}    
      actionButton.disabled = true;
      actionButton.textContent = '受付処理中...';
    
      const checkInCallbackName =
        'manualCheckInCallback_' + Date.now();
    
      window[checkInCallbackName] = function(result) {
        if (result.success) {
          participant.receptionStatus = '受付済';
    
          showParticipant(participant);
          searchParticipantsByName();
    
          alert(
            result.name + ' 様の受付が完了しました。\n' +
            '受付時刻：' + result.time
          );
        } else {
          actionButton.disabled = false;
          actionButton.textContent = '受付する';
          alert(result.message);
        }
    
        delete window[checkInCallbackName];
        checkInScript.remove();
      };
    
      const checkInScript =
        document.createElement('script');
    
      checkInScript.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=checkin' +
        '&id=' + encodeURIComponent(participant.receptionId) +
        '&method=' + encodeURIComponent('手動') +
        '&callback=' + encodeURIComponent(checkInCallbackName);
    
      checkInScript.onerror = function() {
        actionButton.disabled = false;
        actionButton.textContent = '受付する';
    
        alert('受付APIの呼び出しに失敗しました。');
    
        delete window[checkInCallbackName];
        checkInScript.remove();
      };
    
      document.body.appendChild(checkInScript);
};
  
    resultsArea.appendChild(document.createElement('br'));
    resultsArea.appendChild(document.createElement('br'));
    resultsArea.appendChild(actionButton);
    
  }
  

    
  </script>

</body>
</html>
