<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBOG交流会 受付</title>
　<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin: 16px 0;
    }

  #nameSearch {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin: 8px 0;
  }

  #nameSearchButton {
      width: auto;
      padding: 12px 24px;
      font-size: 16px;
      margin: 8px 0 16px;
  }

   .reception-filter-button {
    width: auto;
    padding: 10px 16px;
    font-size: 16px;
    margin: 4px;
  } 
    
  .reception-list-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 14px;
  }
  
  .reception-list-table th,
  .reception-list-table td {
      padding: 10px 4px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
  }

  .reception-list-table th:nth-child(1) {
  padding-left: 0;
  padding-right: 0;
  font-size: 13px;
  }
  
  .reception-list-table th:nth-child(1),
  .reception-list-table td:nth-child(1) {
      width: 14%;
      text-align: center;
  }
  
  .reception-list-table th:nth-child(2),
  .reception-list-table td:nth-child(2) {
      width: 30%;
  }
  
  .reception-list-table th:nth-child(3),
  .reception-list-table td:nth-child(3) {
      width: 14%;
  }
  
  .reception-list-table th:nth-child(4),
  .reception-list-table td:nth-child(4) {
      width: 25%;
  }
  
  .reception-list-table th:nth-child(5),
  .reception-list-table td:nth-child(5) {
      width: 17%;
      text-align: center;
  }

  .reception-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: white;
      font-size: 14px;
      font-weight: bold;
      line-height: 1;
  }
    
  .reception-status-done {
    background-color: #22a559;
  }
  
  .reception-status-pending {
    background-color: #aeb7c2;
  }

  .reception-sort-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
  }

  .reception-sort-controls p {
    width: 100%;
    margin: 0 0 4px;
  }

  .reception-sort-controls button {
    width: auto;
    padding: 8px 12px;
    margin: 0;
    font-size: 14px;
  }

  .reception-filter-controls {
      display: flex;
      gap: 8px;
      margin: 16px 0;
  }
  
  .reception-filter-controls button {
      width: auto;
      padding: 10px 8px;
      margin: 0;
      font-size: 14px;
  }

  .reception-filter-controls button.active {
    background-color: #24a259;
    color: white;
    border-color: #24a259;
    font-weight: bold;
  }
    
</style>
</head>

<body>

  <h1>OBOG交流会 受付</h1>

<div id="homeScreen">
  <h2>受付メニュー</h2>

  <button type="button" id="homeQrButton">
      🔍 QRコードを読み取る
  </button>

  <button type="button" id="homeSearchButton">
      名前で検索
  </button>

  <button type="button" id="homeListButton">
      受付一覧
  </button>
</div>

  
  
  <button type="button" onclick="startQrScanner()">
    🔍 QRコードを読み取る
  </button>
  
  <div id="qr-reader" style="display: none;"></div>

  <p id="qr-result">QR読み取り待機中</p>

  <hr>

 <h2>受付一覧</h2>

  <label for="nameSearch">氏名・ふりがな</label>
  
  <input
    type="text"
    id="nameSearch"
    placeholder="氏名またはふりがなを入力">
  
  <button type="button" id="nameSearchButton" onclick="searchParticipantsByName()">
    名前で検索
  </button>
  
  <div id="nameSearchResults"></div>
   
  <div id="receptionListArea"></div>
  
  <script>
    
    function renderReceptionAction(
    participant,
    targetArea = document.getElementById('qr-result'),
    method = 'QR'
    ) {
        const qrResult = targetArea;
    
      if (participant.receptionStatus !== '受付済') {
        const checkInButton = document.createElement('button');
        checkInButton.textContent = '受付する';
        
        checkInButton.onclick = function() {
          executeCheckIn(participant, method, targetArea, checkInButton);
        };
        
        qrResult.appendChild(document.createElement('br'));
        qrResult.appendChild(document.createElement('br'));
        qrResult.appendChild(checkInButton);
      } else {
          const cancelButton = document.createElement('button');
          cancelButton.textContent = '受付取消';
          
          cancelButton.onclick = function() {
              executeCancel(participant, method, targetArea, cancelButton);
          };
          
          qrResult.appendChild(document.createElement('br'));
          qrResult.appendChild(document.createElement('br'));
          qrResult.appendChild(cancelButton);
      }
    }

    function executeCheckIn(participant, method = 'QR', targetArea = document.getElementById('qr-result'), checkInButton) {
    const qrResult = targetArea;
    
      checkInButton.disabled = true;
      checkInButton.textContent = '受付処理中...';

      const callbackName = 'checkInCallback_' + Date.now();

      window[callbackName] = function(result) {
        if (result.success) {
          participant.receptionStatus = '受付済';
      
          qrResult.innerHTML =
            '✓ 受付完了！<br><br>' +
            '氏名：' + result.name + '<br>' +
            '受付時刻：' + result.time;
      
          alert(
            result.name + ' 様の受付が完了しました。\n' +
            '受付時刻：' + result.time
          );

          renderReceptionAction(participant, targetArea, method);
          loadReceptionList();
        } else {
          checkInButton.disabled = false;
          checkInButton.textContent = '受付する';
          alert(result.message);
        }
      };

      const script = document.createElement('script');
      
      script.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=checkin' +
        '&id=' + encodeURIComponent(participant.receptionId) +
        '&method=' + encodeURIComponent(method) +
        '&callback=' + encodeURIComponent(callbackName);
      
      document.body.appendChild(script);
      
    }

    function executeCancel(participant, method = 'QR', targetArea = document.getElementById('qr-result'), cancelButton) {
    const confirmed = confirm(participant.name + ' 様の受付を取り消してよろしいですか？');

    if (!confirmed) {
        return;
    }

    const qrResult = targetArea;    
        cancelButton.disabled = true;
        cancelButton.textContent = '取消処理中...';


        const callbackName = 'cancelCallback_' + Date.now();
        
        window[callbackName] = function(result) {
            if (result.success) {
                participant.receptionStatus = '未受付';
        
                qrResult.innerHTML =
                    '✓ 受付取消完了<br><br>' +
                    '氏名：' + result.name;
        
                renderReceptionAction(participant, targetArea, method);   
                loadReceptionList();
            } else {
                cancelButton.disabled = false;
                cancelButton.textContent = '受付取消';
                alert(result.message);
            }
            delete window[callbackName];
            script.remove();
          
        };

        const script = document.createElement('script');
        
        script.src =
            'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
            '?api=cancel' +
            '&id=' + encodeURIComponent(participant.receptionId) +
            '&method=' + encodeURIComponent(method) +
            '&callback=' + encodeURIComponent(callbackName);
        
        document.body.appendChild(script);
      
    }
    
    async function startQrScanner() {
        const qrResult = document.getElementById('qr-result');
        const qrReader = document.getElementById('qr-reader');

        qrReader.style.display = 'block';
        qrResult.textContent = 'QRリーダー起動中...';
      
        const scanner = new Html5Qrcode('qr-reader');
      
        try {
            await scanner.start(
              { facingMode: 'environment' },
              {
                fps: 10,
                qrbox: {
                  width: 250,
                  height: 250
                }
              },
           function(decodedText) {
             scanner.stop().catch(function(error) {
                 console.error(error);
             });

             qrReader.style.display = 'none';
             
             try {
                 const url = new URL(decodedText);
                 const receptionId = url.searchParams.get('id');
              
                if (!receptionId) {
                    throw new Error('受付IDがURLに含まれていません');
                }
    
        qrResult.textContent =
            'QR読み取り成功！\n' +
            '受付ID：' + receptionId +
            '\n参加者情報を確認しています...';
    
        const callbackName = 'participantCallback_' + Date.now();
    
       window[callbackName] = function(participant) {
        if (participant.success) {
            qrResult.innerHTML =
                '参加者確認完了！<br><br>' +
                '氏名：' + participant.name + '<br>' +
                '期数：' + participant.term + '<br>' +
                '懇親会：' + participant.partyStatus + '<br>' +
                '受付状況：' + participant.receptionStatus + '<br><br>';
    
            renderReceptionAction(participant);

    } else {
        qrResult.textContent =
            '参加者を確認できませんでした。\n' +
            participant.message;
    }

    delete window[callbackName];
    script.remove();
};

    const script = document.createElement('script');
    
    script.src =
      'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
      '?api=participant' +
      '&id=' + encodeURIComponent(receptionId) +
      '&callback=' + encodeURIComponent(callbackName);
    
    script.onerror = function() {
        qrResult.innerHTML +=
            '<br>参加者情報の取得に失敗しました。';
    
        delete window[callbackName];
        script.remove();
    };

    document.body.appendChild(script);

} catch (error) {
qrResult.textContent =
    'QRコードの解析に失敗しました。\n' +
    '読み取り内容：' + decodedText;
}
},
      function() {
        // QRをまだ認識していない間は何もしない
      }
    );
  } catch (error) {
    qrReader.style.display = 'none';
          
    qrResult.textContent =
      'QRリーダー起動失敗\n' +
      'name: ' + (error.name || '不明') + '\n' +
      'message: ' + (error.message || String(error));

    console.error(error);
  }
}

function searchParticipantsByName() {
    const keyword = document.getElementById('nameSearch').value.trim();

    receptionSearchKeyword = keyword;

    if (receptionListData.length === 0) {
        alert('先に受付一覧を表示してください。');
        return;
    }

    const normalizedKeyword = keyword
        .replace(/\s/g, '')
        .toLowerCase();

    const filteredParticipants = receptionListData.filter(function(participant) {
        const name = String(participant.name || '')
            .replace(/\s/g, '')
            .toLowerCase();

        const kana = String(participant.kana || '')
            .replace(/\s/g, '')
            .toLowerCase();

        const matchesSearch =
            normalizedKeyword === '' ||
            name.includes(normalizedKeyword) ||
            kana.includes(normalizedKeyword);

        const matchesStatus =
            receptionFilter === 'all' ||
            (receptionFilter === 'done' &&
                participant.receptionStatus === '受付済') ||
            (receptionFilter === 'pending' &&
                participant.receptionStatus !== '受付済');

        return matchesSearch && matchesStatus;
    });

    const listArea = document.getElementById('receptionListArea');

    listArea.replaceChildren();

    const summary = document.createElement('p');
    summary.textContent =
        '参加者：' +
        receptionListData.length +
        '名 ／ 表示：' +
        filteredParticipants.length +
        '名';

    listArea.appendChild(summary);

    renderReceptionFilterControls(listArea);
       
    if (filteredParticipants.length === 0) {
        const noResults = document.createElement('p');
        noResults.textContent = '該当する参加者が見つかりませんでした。';
        noResults.className = 'reception-no-results';
        listArea.appendChild(noResults);
    } else {
        renderReceptionList(filteredParticipants, listArea);
    }
  }
    
  function showParticipant(participant) {
    const resultsArea =
        document.getElementById('nameSearchResults');

    resultsArea.innerHTML =
        '氏名：' + participant.name + '<br>' +
        '期数：' + participant.term + '<br>' +
        '懇親会：' + (participant.partyStatus || '参加') + '<br>' +
        '受付状況：' + participant.receptionStatus;

    renderReceptionAction(
        participant,
        resultsArea,
        '手動'
    );
  }

    function loadReceptionList() {
      const listArea = document.getElementById('receptionListArea');
    
      listArea.textContent = '受付一覧を読み込み中...';
    
      const callbackName = 'receptionListCallback_' + Date.now();
    
      window[callbackName] = function(participants) {
        console.log(participants);
        
        receptionListData = participants;

        receptionListData.sort(function(a, b) {
          const valueA = String(a.kana || '');
          const valueB = String(b.kana || '');
        
          return valueA.localeCompare(
            valueB,
            'ja',
            { numeric: true }
          );
        });
      
        listArea.replaceChildren();
      
        const summary = document.createElement('p');
        summary.textContent = '参加者：' + participants.length + '名';
        listArea.appendChild(summary);

        renderReceptionFilterControls(listArea);
        renderReceptionList(receptionListData, listArea);
      
        delete window[callbackName];
        script.remove();
      };
    
      const script = document.createElement('script');
    
      script.src =
        'https://script.google.com/macros/s/AKfycbzdRcn5Jpi1K4feibiRSs8t6nFVJl9VJI7lpQ-ort--k9a2A7ENJG1CR55ml3z_n4AP/exec' +
        '?api=list' +
        '&callback=' + encodeURIComponent(callbackName);
    
      script.onerror = function() {
        listArea.textContent = '受付一覧の取得に失敗しました。';
    
        delete window[callbackName];
        script.remove();
      };
    
      document.body.appendChild(script);
    }

    let receptionListData = [];
    let receptionSortKey = 'kana';
    let receptionSortDirection = 'asc';
    let receptionFilter = 'all';
    let receptionSearchKeyword = '';
    
    
    function renderReceptionList(participants, listArea) {
      const table = document.createElement('table');
      table.className = 'reception-list-table';
  
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
  
      const headers = ['受付', '氏名', '期数', 'パート', '受付時刻'];
  
      headers.forEach(function(headerText) {
          const th = document.createElement('th');
          th.textContent = headerText;
      
          if (headerText === '氏名') {
              th.style.cursor = 'pointer';
      
              if (receptionSortKey === 'kana') {
                  th.textContent =
                      '氏名' +
                      (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
              }
      
              th.onclick = function(event) {
                  event.stopPropagation();
                  sortReceptionList('kana');
              };
          }

        if (headerText === '期数') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'term') {
                th.textContent =
                    '期数' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('term');
            };
        }

        if (headerText === 'パート') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'part') {
                th.textContent =
                    'パート' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('part');
            };
        }

        if (headerText === '受付') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'receptionStatus') {
                th.textContent =
                    '受付' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('receptionStatus');
            };
        }

        if (headerText === '受付時刻') {
            th.style.cursor = 'pointer';
        
            if (receptionSortKey === 'receptionTime') {
                th.textContent =
                    '受付時刻' +
                    (receptionSortDirection === 'asc' ? ' ▲' : ' ▼');
            }
        
            th.onclick = function(event) {
                event.stopPropagation();
                sortReceptionList('receptionTime');
            };
        }
      
          headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);
      
      participants.forEach(function(participant) {
      const row = document.createElement('tr');

      row.style.cursor = 'pointer';

      row.onclick = function() {
          showParticipant(participant);
      };
  
      const statusCell = document.createElement('td');

      const statusIcon = document.createElement('span');
      statusIcon.className =
          participant.receptionStatus === '受付済'
              ? 'reception-status reception-status-done'
              : 'reception-status reception-status-pending';
      
      statusIcon.textContent =
          participant.receptionStatus === '受付済' ? '✓' : '−';
      
      statusCell.appendChild(statusIcon);
  
      const nameCell = document.createElement('td');
      nameCell.textContent = participant.name;
  
      const termCell = document.createElement('td');
      termCell.textContent = String(participant.term || '').split('（')[0];
  
      const partCell = document.createElement('td');
      partCell.textContent = participant.part;
  
      const receptionTimeCell = document.createElement('td');
        
      if (participant.receptionTime) {
          const receptionDate = new Date(participant.receptionTime);
      
          receptionTimeCell.textContent =
              receptionDate.toLocaleTimeString('ja-JP', {
                  hour: '2-digit',
                  minute: '2-digit',
                  hour12: false,
                  timeZone: 'Asia/Tokyo'
              });
      } else {
          receptionTimeCell.textContent = '－';
      }
  
      row.appendChild(statusCell);
      row.appendChild(nameCell);
      row.appendChild(termCell);
      row.appendChild(partCell);
      row.appendChild(receptionTimeCell);
  
      table.appendChild(row);
  });
  
  listArea.appendChild(table);
    }

    function sortReceptionList(key) {
      if (receptionSortKey === key) {
        receptionSortDirection =
          receptionSortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        receptionSortKey = key;
        receptionSortDirection = 'asc';
      }

      receptionListData.sort(function(a, b) {
        const partOrder = {
          'ソプラノ1': 1,
          'ソプラノ2': 2,
          'アルト1': 3,
          'アルト2': 4,
          'テノール1': 5,
          'テノール2': 6,
          'バス1': 7,
          'バス2': 8
        };
        
        if (receptionSortKey === 'part') {
          const orderA = partOrder[a.part] || 999;
          const orderB = partOrder[b.part] || 999;
        
          return receptionSortDirection === 'asc'
            ? orderA - orderB
            : orderB - orderA;
        }
        const valueA = String(a[receptionSortKey] || '');
        const valueB = String(b[receptionSortKey] || '');
    
        const comparison = valueA.localeCompare(
          valueB,
          'ja',
          { numeric: true }
        );
    
        return receptionSortDirection === 'asc'
          ? comparison
          : -comparison;
      });

      const listArea = document.getElementById('receptionListArea');

      receptionFilter = 'all';
      
      listArea.replaceChildren();
    
      const summary = document.createElement('p');
      summary.textContent = '参加者：' + receptionListData.length + '名';
      listArea.appendChild(summary);

      renderReceptionFilterControls(listArea);
      (listArea);
      
      renderReceptionList(receptionListData, listArea);
      }

    function renderReceptionFilterControls(listArea) {
        const controls = document.createElement('div');
        controls.className = 'reception-filter-controls';
    
        const doneCount = receptionListData.filter(function(participant) {
            return participant.receptionStatus === '受付済';
        }).length;
        
        const pendingCount = receptionListData.length - doneCount;
        
        const filters = [
            { key: 'all', label: 'すべて ' + receptionListData.length },
            { key: 'done', label: '受付済 ' + doneCount },
            { key: 'pending', label: '未受付 ' + pendingCount }
        ];
    
        filters.forEach(function(filter) {
            const button = document.createElement('button');
            button.type = 'button';
            button.classList.add('reception-filter-button');
            button.textContent = filter.label;

            if (receptionFilter === filter.key) {
                button.classList.add('active');
            }  
    
            button.onclick = function() {
                receptionFilter = filter.key;
            
                const filteredParticipants = receptionListData.filter(function(participant) {
                    if (receptionFilter === 'done') {
                        return participant.receptionStatus === '受付済';
                    }
            
                    if (receptionFilter === 'pending') {
                        return participant.receptionStatus !== '受付済';
                    }
            
                    return true;
                });
            
                listArea.replaceChildren();
            
                const summary = document.createElement('p');
                summary.textContent = '参加者：' + receptionListData.length + '名';
                listArea.appendChild(summary);
            
                renderReceptionFilterControls(listArea);      
                renderReceptionList(filteredParticipants, listArea);
            };    
            controls.appendChild(button);
        });
    
        listArea.appendChild(controls);
    }
    
  

    window.addEventListener('DOMContentLoaded', function() {
    loadReceptionList();
    });
    
  </script>

</body>
</html>
